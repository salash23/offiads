<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFIADS – Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--g:#12a66a;--gd:#0c8a57;--gl:#e3f6ec;--ink:#14263a;--mu:#7a8a99;--ln:#e6edf2;--bl:#3b82f6;--vi:#8b5cf6;--am:#f59e0b;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f6fafd,#eef7f3 60%,#f3f6fb);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.lg{font-weight:800;font-size:24px;letter-spacing:-.5px}.lg b{color:var(--g)}
.btn{background:var(--g);color:#fff;padding:10px 18px;border-radius:9px;font-weight:600;transition:.2s}.btn:hover{background:var(--gd);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--ln)}.btn.o:hover{background:#f4f8fa}.btn.s{padding:5px 10px;font-size:12px}.btn.r{background:#fee2e2;color:#b91c1c}.btn.a{background:#d3f8e4;color:#087a4f}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:18px;box-shadow:0 6px 24px -14px rgba(20,38,58,.18)}.card h3{margin:0 0 12px;font-size:15px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login .card{width:min(400px,100%);padding:32px;display:grid;gap:14px;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600}
input,select,textarea{padding:10px 12px;border:1px solid var(--ln);border-radius:9px;background:#fff;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--g);outline:0;box-shadow:0 0 0 3px rgba(18,166,106,.15)}
#app{display:none;grid-template-columns:220px 1fr;min-height:100vh}#app.on{display:grid}
aside{background:#fff;border-right:1px solid var(--ln);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}aside .lg{padding:0 10px 18px}
.nv{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;background:none;color:var(--ink);font-weight:500;transition:.15s}.nv:hover{background:#f1f6f8}.nv.on{background:var(--gl);color:var(--gd);font-weight:700}
.help{margin-top:auto;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:12px;color:var(--mu);display:grid;gap:8px}
main{padding:18px 26px;min-width:0}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top input{max-width:300px}.sp{flex:1}
.ic{background:#fff;border:1px solid var(--ln);width:36px;height:36px;border-radius:50%;position:relative}.ic i{position:absolute;top:-2px;right:-2px;background:var(--rd);color:#fff;border-radius:9px;font:700 10px/1 inherit;padding:3px 5px;font-style:normal}
.av{display:flex;align-items:center;gap:8px;background:none;font-weight:600}.av b{width:32px;height:32px;border-radius:50%;background:#dbeafe;color:#1e40af;display:grid;place-items:center;font-size:12px}
h1{margin:0;font-size:22px;letter-spacing:-.5px}.sub{color:var(--mu);margin:3px 0 0;font-size:13px}.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.vw{animation:in .4s}.gr{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:3fr 2fr}.g22{grid-template-columns:1fr 1fr}.mt{margin-top:14px}
.kp{display:flex;gap:12px;align-items:center}.kp i{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:17px;flex:none}.kp span{font-size:12px;color:var(--mu);display:block}.kp b{font-size:22px;letter-spacing:-.5px}.kp em{font-style:normal;font-size:11.5px;color:var(--g);font-weight:700;margin-left:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:9px 10px}td{padding:11px 10px;border-top:1px solid var(--ln);font-size:13px}tbody tr:hover{background:#f8fbfa}
.st{padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}.Active,.Approuvée{background:#d3f8e4;color:#087a4f}.Terminée{background:#e0e7ff;color:#4338ca}.En-attente{background:#ffefd0;color:#9a6200}.Suspendue,.Refusée{background:#fee2e2;color:#b91c1c}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:12px;flex-wrap:wrap}.tabs button{background:none;padding:9px 12px;color:var(--mu);border-bottom:2px solid transparent;font-weight:600}.tabs button.on{color:var(--g);border-color:var(--g)}
.fl{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.fl>*{width:auto;min-width:130px}
.pg{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}.pg button{width:30px;height:30px;border-radius:7px;background:#fff;border:1px solid var(--ln)}.pg .on{background:var(--g);color:#fff;border-color:var(--g)}
.pos{color:var(--g);font-weight:700}.neg{color:var(--rd);font-weight:700}
.stp{display:flex;justify-content:space-between;margin-bottom:20px}.stp div{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}.stp b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e8eef2;margin:0 auto 4px;color:var(--mu);transition:.3s}.stp .on b,.stp .dn b{background:var(--g);color:#fff}.stp .on{color:var(--ink);font-weight:700}
.wz{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.fm{display:grid;gap:12px;align-content:start}
.pv{border-radius:12px;background:linear-gradient(160deg,#e3f6ec,#dbeafe);padding:20px;min-height:220px}.pv h4{font-size:20px;margin:10px 0 6px;line-height:1.15}.pv p{font-size:12px;color:var(--mu)}
.ch{display:flex;gap:8px;flex-wrap:wrap}.ch label{border:1px solid var(--ln);padding:8px 14px;border-radius:9px;cursor:pointer;display:flex;gap:6px;align-items:center;width:auto}.ch label:has(input:checked){border-color:var(--g);background:var(--gl);font-weight:700}.ch input{width:auto}
.hb{display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.hb div{height:9px;background:#e8f6ef;border-radius:9px}.hb i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width 1s}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu)}.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
svg text{fill:var(--mu);font:10px 'Plus Jakarta Sans'}.dr{stroke-dasharray:1500;stroke-dashoffset:1500;animation:dr 1.5s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pdf{background:#3a3f45;padding:10px;border-radius:12px}.pdf .bar{color:#fff;display:flex;justify-content:space-between;padding:4px 8px 10px;font-size:12px}.pdf .pg1{background:#fff;border-radius:6px;padding:24px}
#md{position:fixed;inset:0;background:rgba(20,38,58,.45);display:none;place-items:center;z-index:9;padding:16px}#md.on{display:grid}#md .card{width:min(440px,100%);display:grid;gap:12px;animation:in .25s}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.3s;z-index:10}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto}aside .lg,.help{display:none}.nv{white-space:nowrap;width:auto}.g2,.g22,.wz{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.top,.hd,.bar{display:none}#app{display:block}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section id="login"><div class="card"><div class="lg"><b>O</b>FFIADS</div><div class="sub">Touchez les pharmacies. Développez votre marque.</div>
<label class="f">E-mail<input id="em" value="contact@laboratoire-xyz.dz"></label>
<label class="f">Mot de passe<input id="pw" type="password" value="123456"></label>
<button class="btn" onclick="login()">Se connecter</button>
<div style="display:flex;gap:8px"><button class="btn o s" style="flex:1" onclick="em.value='contact@laboratoire-xyz.dz'">Espace annonceur</button><button class="btn o s" style="flex:1" onclick="em.value='admin@offiads.dz'">Espace admin</button></div></div></section>
<div id="app"><aside id="sd"></aside><main><div class="top" id="tp"></div><div id="mn" class="vw"></div></main></div>
<div id="md"><div class="card" id="mc"></div></div><div class="toast" id="ts"></div>
<script>
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' '),rd=s=>{let x=Math.sin(s*12.9)*1e4;return x-Math.floor(x)};
const toast=m=>{ts.textContent=m;ts.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>ts.classList.remove('on'),2200)};
const names=['Lancement Produit X','Campagne Saisonnière','Promotion Produit Y','Lancement C','Campagne Notoriété','Dermo Été','Vitamine D','Promo Antalgique','Lancement Sirop','Nutrition Bébé','Parapharmacie Duo','Rentrée Santé'];
const sts=['Active','Active','Terminée','En attente','Terminée','Active','Terminée','Terminée','Suspendue','Terminée','Terminée','Terminée'];
let S={role:'adv',v:'dash',pg:1,tab:'',fmt:'',st:'',per:'',q:'',rep:1,solde:250000,res:100000,dep:50000,sel:'',w:null,aq:'',as:'',
camps:names.map((n,i)=>{const b=[100,80,60,100,50][i%5]*1000,d=sts[i]=='En attente'?0:Math.round(b*(.3+rd(i)*.7));return{id:i+1,n,fmt:['Vidéo','Image','Bannière'][i%3],bud:b,dep:d,imp:d*13,clk:Math.round(d*.2),st:sts[i],adv:i<5?'Laboratoire XYZ':['PharmaPlus','MediSanté','BioPharm'][i%3],date:'0'+(1+i%9)+'/10/2026'}}),
tx:[['07/10/2026','Recharge','Virement bancaire',200000,250000],['06/10/2026','Consommation','Campagne Produit A',-30000,50000],['06/10/2026','Réservation','Campagne Lancement C',-100000,80000],['05/10/2026','Consommation','Campagne Produit B',-20000,180000],['02/10/2026','Libération','Fin campagne (solde non utilisé)',15000,200000]],txf:'',
advs:[['Laboratoire XYZ','contact@xyz.dz',250000,5,'Actif'],['Pharma Plus','contact@pharmaplus.dz',180000,4,'Actif'],['MediSanté','contact@medisante.dz',320000,3,'En attente'],['BioPharm','contact@biopharm.dz',150000,2,'Actif']],
eds:[['XpertPharm',1,1250,480000,30,'Actif'],['ChifaOfficine',1,980,320000,30,'Actif'],['PharmaSoft',1,650,210000,25,'Actif'],['MediSys',1,540,180000,25,'En attente']]};
const cls=s=>s.replace(' ','-');
const T=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r}</tbody></table></div>`;
const K=(i,bg,l,v,d)=>`<div class="card kp"><i style="background:${bg}">${i}</i><div><span>${l}</span><b>${v}</b><em>${d||''}</em></div></div>`;
const KP=(m=1)=>K('📊','#e3f6ec','Impressions',f(1245800*m),'+12%')+K('🏥','#d1fae5','Pharmacies touchées',f(86420*m),'+8%')+K('👆','#ede9fe','Clics',f(18420*m),'+15%')+K('◔','#ffefd0','CTR','1,48 %','+0,3%');
function area(a,w=520,h=200){const mx=Math.max(...a)*1.1,x=i=>30+i*(w-40)/(a.length-1),y=v=>h-24-v*(h-40)/mx,d=a.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('');return`<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12a66a" stop-opacity=".35"/><stop offset="1" stop-color="#12a66a" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="30" x2="${w}" y1="${y(mx*i/3.3)}" y2="${y(mx*i/3.3)}" stroke="#e6edf2"/><text x="0" y="${y(mx*i/3.3)+3}">${f(mx*i/3.3/1000)}K</text>`).join('')}<path d="${d}L${x(a.length-1)} ${h-24}L30 ${h-24}Z" fill="url(#ga)"/><path class="dr" d="${d}" fill="none" stroke="#12a66a" stroke-width="2.5"/></svg>`}
function bars(a,b,w=640,h=190){const n=a.length,mx=Math.max(...a)*1.1,bw=(w-40)/n,y=v=>h-22-v*(h-34)/mx;return`<svg viewBox="0 0 ${w} ${h}" width="100%">${[0,1,2,3].map(i=>`<line x1="30" x2="${w}" y1="${h-22-i*(h-34)/3.3}" y2="${h-22-i*(h-34)/3.3}" stroke="#e6edf2"/>`).join('')}${a.map((v,i)=>`<rect x="${32+i*bw}" y="${y(v)}" width="${Math.max(3,bw*.6)}" height="${h-22-y(v)}" rx="2" fill="#12a66a"/>`).join('')}<path class="dr" d="${b.map((v,i)=>(i?'L':'M')+(35+i*bw)+' '+y(v*mx/Math.max(...b)*.7)).join('')}" fill="none" stroke="#3b82f6" stroke-width="2"/></svg>`}
function donut(p,c,sub,sz=150){const r=52,C=2*Math.PI*r;let o=0;const col=['#12a66a','#3b82f6','#8b5cf6'];return`<svg viewBox="0 0 140 140" width="${sz}"><g transform="rotate(-90 70 70)">${p.map((v,i)=>{const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${col[i]}" stroke-width="16" stroke-dasharray="${C*v/100-2} ${C}" stroke-dashoffset="${-o}"/>`;o+=C*v/100;return s}).join('')}</g><text x="70" y="70" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#14263a">${c}</text><text x="70" y="85" text-anchor="middle">${sub}</text></svg>`}
const hb=a=>a.map(([n,v])=>`<div class="hb"><span>${n}</span><div><i style="width:0" data-w="${v*2}%"></i></div><b>${v}%</b></div>`).join('');
const fmtL=`<div class="lgd"><span><i style="background:#12a66a"></i>Image 45%</span><span><i style="background:#3b82f6"></i>Vidéo 35%</span><span><i style="background:#8b5cf6"></i>Bannière 20%</span></div>`;
const series=(s,n)=>[...Array(n)].map((_,i)=>20+rd(s+i)*50+i*(60/n));
const pill=s=>`<span class="st ${cls(s)}">${s}</span>`;
const nav={adv:[['dash','Dashboard'],['camp','Campagnes'],['stat','Statistiques'],['wal','Wallet / Solde'],['rap','Rapports']],adm:[['dash','Dashboard'],['ann','Annonceurs'],['edi','Éditeurs'],['val','Campagnes à valider']]};
function login(){S.role=em.value.includes('admin')?'adm':'adv';S.v='dash';login_.style.display='none';app.classList.add('on');R()}const login_=$('#login'),app=$('#app');
function out(){app.classList.remove('on');login_.style.display='grid';closeM()}
function go(v){S.v=v;S.pg=1;R()}
function R(){const pend=S.camps.filter(c=>c.st=='En attente').length;
sd.innerHTML=`<div class="lg"><b>O</b>FFIADS</div>`+nav[S.role].map(([k,l])=>`<button class="nv ${S.v==k||(S.v=='wiz'&&k=='camp')?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+`<div class="help"><b>Besoin d'aide ?</b>Notre équipe est là pour vous accompagner.<button class="btn o s" onclick="toast('Message envoyé à support@offiads.dz')">Nous contacter</button></div>`;
tp.innerHTML=(S.role=='adv'?`<input placeholder="Rechercher une campagne…" value="${S.q}" onkeydown="if(event.key=='Enter'){S.q=this.value;S.tab='';go('camp')}">`:'')+`<div class="sp"></div><button class="ic" onclick="toast('${S.role=='adm'?pend+' campagne(s) en attente de validation':'Aucune nouvelle notification'}')">🔔${S.role=='adm'&&pend?`<i>${pend}</i>`:''}</button><button class="av" onclick="userM()"><b>${S.role=='adm'?'AD':'LZ'}</b><span>${S.role=='adm'?'Admin':'Laboratoire XYZ'}</span> ▾</button>`;
mn.innerHTML=V[S.v]();mn.classList.remove('vw');void mn.offsetWidth;mn.classList.add('vw');setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w),50)}
function userM(){modal('Compte',`<div class="sub">${S.role=='adm'?'Administrateur OFFIADS':'Laboratoire XYZ – Annonceur'}</div>`,'Se déconnecter',out)}
function modal(t,body,ok,fn){mc.innerHTML=`<h3 style="margin:0">${t}</h3>${body}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" onclick="closeM()">Annuler</button>${ok?`<button class="btn" id="mok">${ok}</button>`:''}</div>`;md.classList.add('on');if(ok)$('#mok').onclick=()=>{if(fn()!==false)closeM()}}const md=$('#md');
function closeM(){md.classList.remove('on')}md.onclick=e=>{if(e.target==md)closeM()};
const inp=(id,l,v='',t='text')=>`<label class="f">${l}<input id="${id}" type="${t}" value="${v}"></label>`;
function setRep(id){S.rep=id;go('rap')}
const mine=()=>S.role=='adv'?S.camps.filter(c=>c.adv=='Laboratoire XYZ'):S.camps;
const V={
dash(){if(S.role=='adm'){const act=S.camps.filter(c=>c.st=='Active').length;return`<div class="hd"><div><h1>Bonjour, Admin 👋</h1><p class="sub">Vue globale de la plateforme OFFIADS.</p></div></div><div class="gr k4">${K('💰','#e3f6ec','CA total',f(1450000+S.camps.reduce((a,c)=>a+c.dep,0))+' DA','+12%')}${K('🎯','#d1fae5','Campagnes actives',act)}${K('🏢','#ffefd0','Annonceurs',S.advs.length)}${K('🖥','#dbeafe','Éditeurs',S.eds.length)}</div><div class="gr g2 mt"><div class="card"><h3>Évolution du CA</h3>${area(series(7,31))}</div><div class="card"><h3>Répartition des revenus</h3><div style="text-align:center">${donut([70,20,10],'1,45M DA','CA')}</div><div class="lgd"><span><i style="background:#12a66a"></i>Annonceurs 70%</span><span><i style="background:#3b82f6"></i>Éditeurs 20%</span><span><i style="background:#8b5cf6"></i>Autres 10%</span></div></div></div>`}
const m=mine();return`<div class="hd"><div><h1>Bonjour, Laboratoire XYZ 👋</h1><p class="sub">Voici un aperçu de vos campagnes publicitaires.</p></div><button class="btn" onclick="wiz()">+ Créer une campagne</button></div><div class="gr k4">${KP()}</div><div class="gr g2 mt"><div class="card"><h3>Évolution des impressions</h3>${area(series(3,31))}</div><div class="card"><h3>Répartition par format</h3><div style="text-align:center">${donut([45,35,20],'1,24 M','impressions')}</div>${fmtL}</div></div><div class="card mt"><h3>Dernières campagnes</h3>${T(['Nom','Format','Impressions','Clics','Dépensé','Statut'],m.slice(0,3).map(c=>`<tr><td>${c.n}</td><td>${c.fmt}</td><td>${f(c.imp)}</td><td>${f(c.clk)}</td><td>${f(c.dep)} DA</td><td>${pill(c.st)}</td></tr>`).join(''))}<a href="#" style="color:var(--g);font-weight:600;text-decoration:none" onclick="go('camp');return false">Voir toutes les campagnes →</a></div>`},
camp(){const all=mine(),q=S.q.toLowerCase(),L=all.filter(c=>(!S.tab||c.st==S.tab)&&(!S.fmt||c.fmt==S.fmt)&&(!S.st||c.st==S.st)&&c.n.toLowerCase().includes(q)),pp=5,pgs=Math.max(1,Math.ceil(L.length/pp)),P=L.slice((S.pg-1)*pp,S.pg*pp),n=s=>all.filter(c=>c.st==s).length;
return`<div class="hd"><div><h1>Mes campagnes</h1><p class="sub">Gérez et suivez toutes vos campagnes publicitaires.</p></div><button class="btn" onclick="wiz()">+ Créer une campagne</button></div><div class="card"><div class="tabs">${[['',`Toutes (${all.length})`],['Active',`Actives (${n('Active')})`],['En attente',`En attente (${n('En attente')})`],['Terminée',`Terminées (${n('Terminée')})`],['Suspendue',`Suspendues (${n('Suspendue')})`]].map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.pg=1;R()">${l}</button>`).join('')}</div>
<div class="fl"><select onchange="S.fmt=this.value;S.pg=1;R()"><option value="">Format : Tous</option>${['Image','Vidéo','Bannière'].map(x=>`<option ${S.fmt==x?'selected':''}>${x}</option>`).join('')}</select><select onchange="S.st=this.value;S.pg=1;R()"><option value="">Statut : Tous</option>${['Active','En attente','Terminée','Suspendue'].map(x=>`<option ${S.st==x?'selected':''}>${x}</option>`).join('')}</select><input style="flex:1" placeholder="Rechercher…" value="${S.q}" onchange="S.q=this.value;S.pg=1;R()"></div>
${T(['Nom','Format','Budget','Dépensé','Impressions','Clics','CTR','Statut','Actions'],P.map(c=>`<tr><td><b>${c.n}</b></td><td>${c.fmt}</td><td>${f(c.bud)} DA</td><td>${f(c.dep)} DA</td><td>${f(c.imp)}</td><td>${f(c.clk)}</td><td>${c.imp?(c.clk/c.imp*100).toFixed(2).replace('.',',')+' %':'–'}</td><td>${pill(c.st)}</td><td style="white-space:nowrap"><button class="btn o s" onclick="setRep(${c.id})">Rapport</button> ${c.st=='Active'||c.st=='Suspendue'?`<button class="btn o s" onclick="tg(${c.id})">${c.st=='Active'?'Pause':'Reprendre'}</button>`:''} <button class="btn r s" onclick="del(${c.id})">✕</button></td></tr>`).join('')||'<tr><td colspan=9>Aucune campagne trouvée.</td></tr>')}
<div class="pg"><button onclick="S.pg=Math.max(1,S.pg-1);R()">‹</button>${[...Array(pgs)].map((_,i)=>`<button class="${S.pg==i+1?'on':''}" onclick="S.pg=${i+1};R()">${i+1}</button>`).join('')}<button onclick="S.pg=Math.min(${pgs},S.pg+1);R()">›</button></div></div>`},
stat(){const cs=mine(),d=+(S.per||30),by=S.by||'Jour',n=by=='Jour'?Math.min(d,31):Math.ceil(d/7),sd_=S.sel?+S.sel:0,m=sd_?.35:1;
return`<div class="hd"><div><h1>Statistiques</h1><p class="sub">Analysez les performances de vos campagnes.</p></div></div><div class="fl"><select onchange="S.sel=this.value;R()"><option value="">Toutes les campagnes</option>${cs.map(c=>`<option value="${c.id}" ${S.sel==c.id?'selected':''}>${c.n}</option>`).join('')}</select><select onchange="S.per=this.value;R()">${[7,30,90].map(x=>`<option value="${x}" ${(S.per||30)==x?'selected':''}>Derniers ${x} jours</option>`).join('')}</select><select onchange="S.by=this.value;R()">${['Jour','Semaine'].map(x=>`<option ${by==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="gr k4">${KP(m*d/30)}</div><div class="card mt"><h3>Impressions et clics</h3>${bars(series(+S.sel+d,n),series(+S.sel+d+9,n))}<div class="lgd"><span><i style="background:#12a66a"></i>Impressions</span><span><i style="background:#3b82f6"></i>Clics</span></div></div><div class="gr g22 mt"><div class="card"><h3>Répartition par logiciel</h3>${hb([['XpertPharm',40],['ChifaOfficine',32],['Autres',18],['PharmaSoft',10]])}</div><div class="card"><h3>Répartition par région</h3>${hb([['Alger',28],['Oran',18],['Constantine',12],['Annaba',10],['Autres',32]])}</div></div>`},
wal(){const L=S.tx.filter(t=>!S.txf||t[1]==S.txf);return`<div class="hd"><div><h1>Mon Wallet</h1><p class="sub">Gérez votre solde, consultez vos transactions et effectuez vos recharges.</p></div></div><div class="gr k4">${K('💳','#e3f6ec','Solde disponible',f(S.solde)+' DA')}${K('⏳','#ffefd0','Budget réservé',f(S.res)+' DA')}${K('✔','#dbeafe','Dépensé',f(S.dep)+' DA')}<div class="card" style="display:grid;place-items:center"><button class="btn" onclick="rech()">+ Demander une recharge</button></div></div><div class="card mt"><h3>Transactions</h3><div class="tabs">${['','Recharge','Consommation','Réservation','Libération'].map(k=>`<button class="${S.txf==k?'on':''}" onclick="S.txf='${k}';R()">${k||'Toutes'}</button>`).join('')}</div>${T(['Date','Type','Description','Montant','Solde'],L.map(t=>`<tr><td>${t[0]}</td><td>${pill(t[1]=='Recharge'||t[1]=='Libération'?'Active':t[1]=='Réservation'?'Terminée':'En attente').replace(/>[^<]+</,'>'+t[1]+'<')}</td><td>${t[2]}</td><td class="${t[3]>0?'pos':'neg'}">${t[3]>0?'+':'−'} ${f(Math.abs(t[3]))} DA</td><td>${f(t[4])} DA</td></tr>`).join(''))}</div>`},
rap(){const c=S.camps.find(x=>x.id==S.rep)||S.camps[0],m=c.imp/420000||.01;return`<div class="hd"><div><h1>Rapports</h1><p class="sub">Exportez le rapport d'une campagne.</p></div><div style="display:flex;gap:8px"><select onchange="S.rep=+this.value;R()">${mine().map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${x.n}</option>`).join('')}</select><button class="btn" onclick="try{print()}catch(e){toast('Impression indisponible ici')}">⬇ Télécharger PDF</button></div></div><div class="pdf"><div class="bar"><span>1 / 6</span><span>100%</span></div><div class="pg1"><div style="display:flex;justify-content:space-between;align-items:center"><div class="lg"><b>O</b>FFIADS</div><div style="text-align:right"><h1 style="font-size:18px">Rapport de campagne</h1>${c.n}<br>Période : 07/10/2026 – 07/11/2026<br>${pill(c.st)}</div></div><h3 style="color:var(--g);font-size:12px;margin:16px 0 8px">RÉSUMÉ DES RÉSULTATS</h3><div class="gr k4">${K('📊','#e3f6ec','Impressions',f(c.imp))}${K('🏥','#d1fae5','Pharmacies touchées',f(c.imp/15))}${K('👆','#fee2e2','Clics',f(c.clk))}${K('◔','#ffefd0','CTR',c.imp?(c.clk/c.imp*100).toFixed(2).replace('.',',')+' %':'–')}${K('🎬','#ffefd0','Vues vidéo',f(c.imp*.76))}${K('⏱','#dbeafe','Taux de complétion','68 %')}${K('💰','#dbeafe','Dépensé',f(c.dep)+' DA')}${K('📈','#e3f6ec','CPM moyen','8,2 DA')}</div><div class="gr g2 mt"><div><h3>Performance par jour</h3>${bars(series(c.id,31),series(c.id+4,31))}</div><div><h3>Répartition par format</h3><div style="text-align:center">${donut([45,35,20],f(c.imp/1000)+'K','impressions')}</div>${fmtL}</div></div></div></div>`},
ann(){const L=S.advs.filter(a=>(!S.as||a[4]==S.as)&&a[0].toLowerCase().includes(S.aq.toLowerCase()));return`<div class="hd"><div><h1>Annonceurs</h1><p class="sub">Gérez les annonceurs et leurs comptes.</p></div><button class="btn" onclick="addAdv()">+ Ajouter un annonceur</button></div><div class="card"><div class="fl"><input style="flex:1" placeholder="Rechercher un annonceur…" value="${S.aq}" onchange="S.aq=this.value;R()"><select onchange="S.as=this.value;R()"><option value="">Statut : Tous</option><option ${S.as=='Actif'?'selected':''}>Actif</option><option ${S.as=='En attente'?'selected':''}>En attente</option></select></div>${T(['Entreprise','Contact','Solde','Campagnes','Statut','Actions'],L.map((a,i)=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${f(a[2])} DA</td><td>${a[3]}</td><td>${pill(a[4]=='Actif'?'Active':'En attente').replace(/>[^<]+</,'>'+a[4]+'<')}</td><td><button class="btn o s" onclick="togA('${a[0]}')">${a[4]=='Actif'?'Désactiver':'Activer'}</button></td></tr>`).join('')||'<tr><td colspan=6>Aucun résultat.</td></tr>')}</div>`},
edi(){return`<div class="hd"><div><h1>Éditeurs</h1><p class="sub">Gérez les éditeurs et leur réseau de logiciels.</p></div><button class="btn" onclick="addEd()">+ Ajouter un éditeur</button></div><div class="card">${T(['Éditeur','Logiciels','Pharmacies','Revenus','Commission','Statut'],S.eds.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td>${f(e[2])}</td><td>${f(e[3])} DA</td><td>${e[4]}%</td><td>${pill(e[5]=='Actif'?'Active':'En attente').replace(/>[^<]+</,'>'+e[5]+'<')}</td></tr>`).join(''))}</div>`},
val(){const L=S.camps.filter(c=>c.st=='En attente');return`<div class="hd"><div><h1>Campagnes à valider</h1><p class="sub">${L.length} campagne(s) en attente de validation.</p></div></div><div class="card">${T(['Nom','Annonceur','Format','Budget','Date','Actions'],L.map(c=>`<tr><td><b>${c.n}</b></td><td>${c.adv}</td><td>${c.fmt}</td><td>${f(c.bud)} DA</td><td>${c.date}</td><td style="white-space:nowrap"><button class="btn o s" onclick="toast('${c.n} – ${c.fmt} – ${f(c.bud)} DA')">Voir</button> <button class="btn a s" onclick="dec(${c.id},1)">Approuver</button> <button class="btn r s" onclick="dec(${c.id},0)">Refuser</button></td></tr>`).join('')||'<tr><td colspan=6>Tout est à jour 🎉</td></tr>')}</div>`}};
function tg(id){const c=S.camps.find(x=>x.id==id);c.st=c.st=='Active'?'Suspendue':'Active';toast('Campagne '+(c.st=='Active'?'reprise':'suspendue'));R()}
function del(id){modal('Supprimer la campagne ?','<div class="sub">Cette action est définitive.</div>','Supprimer',()=>{S.camps=S.camps.filter(c=>c.id!=id);toast('Campagne supprimée');R()})}
function rech(){modal('Demander une recharge',inp('am','Montant (DA)','100000','number'),'Recharger',()=>{const a=+am.value;if(a<=0)return toast('Montant invalide'),false;S.solde+=a;S.tx.unshift([new Date().toLocaleDateString('fr-FR'),'Recharge','Virement bancaire',a,S.solde]);toast('Recharge de '+f(a)+' DA ajoutée');R()})}
function dec(id,ok){const c=S.camps.find(x=>x.id==id);c.st=ok?'Active':'Refusée';if(!ok&&c.adv=='Laboratoire XYZ'){S.res-=c.bud;S.solde+=c.bud;S.tx.unshift([new Date().toLocaleDateString('fr-FR'),'Libération','Refus '+c.n,c.bud,S.solde])}toast(ok?'Campagne approuvée':'Campagne refusée');R()}
function addAdv(){modal('Ajouter un annonceur',inp('a1','Entreprise')+inp('a2','E-mail','','email')+inp('a3','Solde initial (DA)','0','number'),'Ajouter',()=>{if(!a1.value||!a2.value)return toast('Nom et e-mail requis'),false;S.advs.unshift([a1.value,a2.value,+a3.value,0,'Actif']);toast('Annonceur ajouté');R()})}
function togA(n){const a=S.advs.find(x=>x[0]==n);a[4]=a[4]=='Actif'?'En attente':'Actif';R()}
function addEd(){modal('Ajouter un éditeur',inp('e1','Nom de l\'éditeur')+inp('e2','Pharmacies','0','number')+inp('e3','Commission (%)','25','number'),'Ajouter',()=>{if(!e1.value)return toast('Nom requis'),false;S.eds.push([e1.value,1,+e2.value,0,+e3.value,'Actif']);toast('Éditeur ajouté');R()})}
// wizard
const WS=['Informations','Créative','Audience','Budget','Dates','Résumé'],WIL=['Alger','Oran','Constantine','Annaba','Sétif','Blida'];
function wiz(){S.w={s:1,n:'',b:'',o:'Notoriété',d:'',fmt:'Bannière',h:'Votre partenaire au quotidien',c:'En savoir plus',wil:['Annaba'],sf:'Tous',bud:100000,d1:'2026-10-15',d2:'2026-11-15'};S.v='wiz';R()}
V.wiz=()=>{const w=S.w,s=w.s,B={1:`<label class="f">Nom de la campagne *<input value="${w.n}" placeholder="Lancement Produit X" oninput="w_('n',this.value)"></label><label class="f">Marque / Produit *<input value="${w.b}" placeholder="Produit X" oninput="w_('b',this.value)"></label><label class="f">Objectif *<select onchange="w_('o',this.value)">${['Notoriété','Trafic','Conversion'].map(x=>`<option ${w.o==x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f">Description (optionnelle)<textarea rows=3 oninput="w_('d',this.value)">${w.d}</textarea></label>`,
2:`<div class="ch">${['Image','Vidéo','Bannière'].map(x=>`<label><input type="radio" name="fm" ${w.fmt==x?'checked':''} onchange="w_('fmt','${x}')">${x}</label>`).join('')}</div><label class="f">Titre de l'annonce *<input value="${w.h}" oninput="w_('h',this.value)"></label><label class="f">Texte du bouton<input value="${w.c}" oninput="w_('c',this.value)"></label>`,
3:`<b>Wilayas ciblées</b><div class="ch">${WIL.map(x=>`<label><input type="checkbox" ${w.wil.includes(x)?'checked':''} onchange="tw('${x}')">${x}</label>`).join('')}</div><label class="f">Logiciel<select onchange="w_('sf',this.value)">${['Tous','XpertPharm','ChifaOfficine','PharmaSoft'].map(x=>`<option ${w.sf==x?'selected':''}>${x}</option>`).join('')}</select></label>`,
4:`<label class="f">Budget (DA) *<input type="number" value="${w.bud}" oninput="w_('bud',+this.value)"></label><div class="sub">Solde disponible : <b>${f(S.solde)} DA</b></div>`,
5:`<label class="f">Date de début *<input type="date" value="${w.d1}" onchange="w_('d1',this.value)"></label><label class="f">Date de fin *<input type="date" value="${w.d2}" onchange="w_('d2',this.value)"></label>`,
6:`<div class="card" style="display:grid;gap:6px"><div><b>Campagne :</b> ${w.n} (${w.b})</div><div><b>Objectif :</b> ${w.o}</div><div><b>Format :</b> ${w.fmt}</div><div><b>Wilayas :</b> ${w.wil.join(', ')} – ${w.sf}</div><div><b>Budget :</b> ${f(w.bud)} DA</div><div><b>Période :</b> ${w.d1} → ${w.d2}</div></div><div class="sub">Après envoi, la campagne sera vérifiée par OFFIADS puis diffusée.</div>`}[s];
return`<div class="hd"><div><h1>Création d'une campagne</h1><p class="sub">Étape ${s} sur 6 – ${WS[s-1]}</p></div></div><div class="card"><div class="stp">${WS.map((x,i)=>`<div class="${i+1==s?'on':i+1<s?'dn':''}"><b>${i+1<s?'✓':i+1}</b>${x}</div>`).join('')}</div><div class="wz"><div class="fm">${B}</div><div><b style="font-size:12px">Aperçu de la campagne</b><div class="pv"><div class="lg" style="font-size:16px"><b>O</b>FFIADS</div><h4 id="pvh">${w.h}</h4><p id="pvn">${w.b||'Votre produit'} – ${w.fmt}</p><button class="btn s" id="pvc">${w.c}</button></div></div></div>
<div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn o" onclick="${s==1?"go('camp')":'w_s(-1)'}">${s==1?'Quitter':'← Précédent'}</button><button class="btn" onclick="nx()">${s==6?'Envoyer la campagne':'Suivant →'}</button></div></div>`};
function w_(k,v){S.w[k]=v;const w=S.w;if($('#pvh')){pvh.textContent=w.h;pvn.textContent=(w.b||'Votre produit')+' – '+w.fmt;pvc.textContent=w.c}}
function tw(x){const a=S.w.wil;a.includes(x)?a.splice(a.indexOf(x),1):a.push(x)}
function w_s(d){S.w.s+=d;R()}
function nx(){const w=S.w,s=w.s,e={1:!w.n||!w.b&&'Nom et marque requis',2:!w.h&&'Titre requis',3:!w.wil.length&&'Choisissez au moins une wilaya',4:!(w.bud>0)?'Budget invalide':w.bud>S.solde&&'Budget supérieur au solde ('+f(S.solde)+' DA)',5:(!w.d1||!w.d2||w.d2<w.d1)&&'Dates invalides'}[s];if(e)return toast(e);
if(s<6)return w_s(1);S.camps.unshift({id:Date.now(),n:w.n,fmt:w.fmt,bud:w.bud,dep:0,imp:0,clk:0,st:'En attente',adv:'Laboratoire XYZ',date:new Date().toLocaleDateString('fr-FR')});S.solde-=w.bud;S.res+=w.bud;S.tx.unshift([new Date().toLocaleDateString('fr-FR'),'Réservation',w.n,-w.bud,S.solde]);toast('Campagne envoyée pour validation');S.tab='En attente';go('camp')}
</script></body></html>
